<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>校園尋物牆 | 匿名尋物留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f7ff 0%, #e9eef5 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        }

        .header p {
            color: #4a627a;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .form-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            padding: 1.5rem 1.8rem;
            margin-bottom: 2rem;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-group {
            flex: 3;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c3e66;
            margin-bottom: 0.3rem;
            letter-spacing: 0.3px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 40px;
            border: 1.5px solid #e2e8f0;
            background: #fefefe;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        .btn-primary {
            background: #1e4b8f;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            white-space: nowrap;
        }

        .btn-primary:hover {
            background: #0f3b6f;
            transform: translateY(-2px);
        }

        .filters-panel {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.85rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f1f5f9;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
        }

        .filter-btn.active {
            background: #1e4b8f;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 1.3rem 1.5rem;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2ff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.15);
        }

        .card.done-card {
            background: #f9fafc;
            opacity: 0.85;
            border-left: 8px solid #34a853;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }

        .category-badge {
            background: #e6edf6;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e4b8f;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            background: #e2f0e6;
            color: #2e6b3e;
        }

        .status-badge.done {
            background: #e9ecef;
            color: #6c757d;
        }

        .content-text {
            font-size: 1rem;
            line-height: 1.4;
            margin: 0.8rem 0;
            color: #0f172a;
            font-weight: 500;
            word-break: break-word;
        }

        .meta-info {
            font-size: 0.7rem;
            color: #5b6e8c;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            border-top: 1px dashed #eef2f0;
            padding-top: 0.6rem;
        }

        .card-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-like {
            background: #fff0f0;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            color: #c2410c;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-like:hover {
            background: #ffe4e4;
            transform: scale(0.97);
        }

        .btn-toggle {
            background: #eef2ff;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-toggle:hover {
            background: #dee4fc;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: rgba(255,255,240,0.5);
            border-radius: 48px;
            color: #5a6e8a;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: #6c86a3;
        }

        @media (max-width: 640px) {
            .form-card {
                padding: 1rem;
            }
            .filters-panel {
                border-radius: 28px;
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📌 校園尋物牆</h1>
        <p>匿名協尋｜讓遺失物快點回家</p>
    </div>

    <!-- 新增帖文表單 -->
    <div class="form-card">
        <div class="form-row">
            <div class="input-group" style="flex:4">
                <label>📝 找什麼東西？ (必填)</label>
                <input type="text" id="contentInput" placeholder="例如：灰色筆電包，在三餐掉了一隻AirPods..." autocomplete="off">
            </div>
            <div class="input-group" style="flex:1.5">
                <label>📂 分類</label>
                <select id="categorySelect">
                    <option value="書本">📖 書本</option>
                    <option value="文具">✒️ 文具</option>
                    <option value="生活用品">🧴 生活用品</option>
                    <option value="電子用品">💻 電子用品</option>
                    <option value="貴重物品">💎 貴重物品</option>
                    <option value="其他">📦 其他</option>
                </select>
            </div>
            <div class="input-group" style="flex:0 0 auto">
                <button class="btn-primary" id="submitBtn">✚ 發佈尋物帖</button>
            </div>
        </div>
        <div style="font-size:0.7rem; color:#b91c1c; margin-top: 0.5rem; display: none;" id="errorMsg">請填寫尋物內容</div>
    </div>

    <!-- 過濾欄位 -->
    <div class="filters-panel">
        <div class="filter-group">
            <span class="filter-label">🔖 狀態：</span>
            <div class="filter-buttons" id="statusFilterGroup">
                <button data-status="all" class="filter-btn active">全部</button>
                <button data-status="active" class="filter-btn">進行中 (active)</button>
                <button data-status="done" class="filter-btn">已完成 (done)</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="filter-label">🗂️ 分類：</span>
            <div class="filter-buttons" id="categoryFilterGroup">
                <button data-cat="all" class="filter-btn active">全部</button>
                <button data-cat="書本" class="filter-btn">書本</button>
                <button data-cat="文具" class="filter-btn">文具</button>
                <button data-cat="生活用品" class="filter-btn">生活用品</button>
                <button data-cat="電子用品" class="filter-btn">電子用品</button>
                <button data-cat="貴重物品" class="filter-btn">貴重物品</button>
                <button data-cat="其他" class="filter-btn">其他</button>
            </div>
        </div>
    </div>

    <!-- 渲染卡片區域 -->
    <div id="recordsContainer" class="records-grid">
        <div class="empty-state">✨ 正在載入資料… ✨</div>
    </div>
    <footer>⚡ 匿名發佈 • 按讚幫助曝光 • 完成尋獲後可標記 done</footer>
</div>

<script>
    (function() {
        // ========== Apps Script 後端網址 ==========
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtB-5nm4FcjKqhADYVR3t2BsxSRVSBgi965zROqIhzzPs5snn0uiqYsfdBvcFjXgGQyA/exec";

        const STORAGE_KEY = "records";

        // ---------- DOM ----------
        const contentInput = document.getElementById("contentInput");
        const categorySelect = document.getElementById("categorySelect");
        const submitBtn = document.getElementById("submitBtn");
        const errorMsgDiv = document.getElementById("errorMsg");
        const recordsContainer = document.getElementById("recordsContainer");

        // ---------- 狀態 ----------
        let allRecords = [];
        let currentStatusFilter = "all";
        let currentCategoryFilter = "all";

        // ========== 後端連接 ==========
        async function fetchRecordsFromSheet() {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "讀取失敗");
            return data.records.map(normalizeRecord);
        }

        async function syncToSheet(payload) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "同步失敗");
            return data;
        }

        function normalizeRecord(sheetRow) {
            return {
                id: sheetRow.ID || sheetRow.id || "",
                createdAt: (function() {
                    const raw = sheetRow.CreatedAt || sheetRow.createdAt;
                    if (!raw) return Date.now();
                    const ts = new Date(raw).getTime();
                    return isNaN(ts) ? Date.now() : ts;
                })(),
                status: (sheetRow.Status || sheetRow.status || "active").toLowerCase() === "done" ? "done" : "active",
                content: sheetRow.Content || sheetRow.content || "",
                category: sheetRow.Category || sheetRow.category || "其他",
                likes: Number(sheetRow.Likes ?? sheetRow.likes ?? 0)
            };
        }

        // ========== 本地儲存 (localStorage) ==========
        function saveToLocalStorage(records) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            } catch(e) {}
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            try {
                return JSON.parse(raw);
            } catch(e) {
                return [];
            }
        }

        // ========== 主要資料流 ==========
        async function loadDataFromSheet() {
            try {
                const records = await fetchRecordsFromSheet();
                allRecords = records;
                allRecords.sort((a,b) => b.createdAt - a.createdAt);
                saveToLocalStorage(allRecords);
                renderFilteredList();
            } catch (err) {
                console.warn("後端載入失敗，改用本地快取", err);
                allRecords = loadFromLocalStorage();
                allRecords.sort((a,b) => b.createdAt - a.createdAt);
                renderFilteredList();
            }
        }

        async function addNewPost(content, category) {
            if (!content || content.trim() === "") {
                errorMsgDiv.style.display = "block";
                setTimeout(() => { errorMsgDiv.style.display = "none"; }, 2000);
                return;
            }
            errorMsgDiv.style.display = "none";

            const newRecord = {
                id: Date.now() + '-' + Math.random().toString(36).substring(2,8),
                createdAt: Date.now(),
                status: "active",
                content: content.trim(),
                category: category,
                likes: 0
            };

            // 先樂觀更新 UI 並存入 localStorage
            allRecords.unshift(newRecord);
            saveToLocalStorage(allRecords);
            renderFilteredList();
            contentInput.value = "";

            // 嘗試同步到 Google Sheet
            try {
                await syncToSheet({ action: "create", record: newRecord });
                // 同步成功後重新拉取以確保一致性
                await loadDataFromSheet();
            } catch(e) {
                console.warn("同步失敗，記錄僅保留在本地", e);
                // 保留在本地即可，不影響使用
            }
        }

        async function updateRecord(id, changes) {
            // 先本地更新
            const idx = allRecords.findIndex(r => r.id === id);
            if (idx === -1) return;
            const oldRecord = allRecords[idx];
            const updatedRecord = { ...oldRecord, ...changes };
            allRecords[idx] = updatedRecord;
            saveToLocalStorage(allRecords);
            renderFilteredList();

            // 同步到後端
            try {
                await syncToSheet({ action: "update", id, changes });
                // 再次從後端拉取最新資料
                await loadDataFromSheet();
            } catch(e) {
                console.warn("更新同步失敗", e);
                // 本地狀態已更新，保持原樣
            }
        }

        // ========== 渲染 ==========
        function renderList(recordsToShow) {
            recordsContainer.innerHTML = "";
            if (!recordsToShow || recordsToShow.length === 0) {
                recordsContainer.innerHTML = '<div class="empty-state">📭 沒有符合條件的尋物帖，試試變更篩選器～</div>';
                return;
            }
            const sorted = [...recordsToShow].sort((a,b) => b.createdAt - a.createdAt);
            for (let record of sorted) {
                const card = document.createElement("div");
                card.className = "card";
                if (record.status === "done") card.classList.add("done-card");

                const dateObj = new Date(record.createdAt);
                const formattedDate = `${dateObj.getFullYear()}/${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours().toString().padStart(2,'0')}:${dateObj.getMinutes().toString().padStart(2,'0')}`;

                const categoryMap = {
                    "書本":"📖 書本","文具":"✒️ 文具","生活用品":"🧴 生活用品",
                    "電子用品":"💻 電子用品","貴重物品":"💎 貴重物品","其他":"📦 其他"
                };
                const categoryShow = categoryMap[record.category] || record.category;
                const statusText = record.status === "active" ? "🔍 尋找中" : "✅ 已完成尋獲";
                const statusClass = record.status === "active" ? "" : "done";

                card.innerHTML = `
                    <div class="card-header">
                        <span class="category-badge">${categoryShow}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="content-text">${escapeHtml(record.content)}</div>
                    <div class="meta-info">
                        <span>🕒 ${formattedDate}</span>
                        <span>❤️ ${record.likes} 人幫推</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn-like" data-id="${record.id}">👍 +1 幫推</button>
                        <button class="btn-toggle" data-id="${record.id}" data-status="${record.status}">${record.status === 'active' ? '🏁 標記完成' : '🔄 恢復 active'}</button>
                    </div>
                `;
                recordsContainer.appendChild(card);
            }

            // 事件綁定
            document.querySelectorAll('.btn-like').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    const record = allRecords.find(r => r.id === id);
                    if (record) {
                        const newLikes = (record.likes || 0) + 1;
                        updateRecord(id, { likes: newLikes });
                    }
                });
            });

            document.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    const currentStatus = btn.getAttribute('data-status');
                    const newStatus = currentStatus === 'active' ? 'done' : 'active';
                    updateRecord(id, { status: newStatus });
                });
            });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function getFilteredRecords() {
            let filtered = [...allRecords];
            if (currentStatusFilter !== "all") {
                filtered = filtered.filter(rec => rec.status === currentStatusFilter);
            }
            if (currentCategoryFilter !== "all") {
                filtered = filtered.filter(rec => rec.category === currentCategoryFilter);
            }
            return filtered;
        }

        function renderFilteredList() {
            const filtered = getFilteredRecords();
            renderList(filtered);
        }

        // ========== 過濾器 ==========
        function initFilters() {
            const statusBtns = document.querySelectorAll("#statusFilterGroup .filter-btn");
            const categoryBtns = document.querySelectorAll("#categoryFilterGroup .filter-btn");

            statusBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const statusVal = btn.getAttribute("data-status");
                    if (statusVal) {
                        currentStatusFilter = statusVal;
                        statusBtns.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        renderFilteredList();
                    }
                });
            });

            categoryBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const catVal = btn.getAttribute("data-cat");
                    if (catVal) {
                        currentCategoryFilter = catVal;
                        categoryBtns.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        renderFilteredList();
                    }
                });
            });
        }

        // ========== 啟動 ==========
        function init() {
            initFilters();
            // 優先從 Google Sheet 載入，失敗則用 localStorage
            loadDataFromSheet();

            submitBtn.addEventListener("click", () => {
                const content = contentInput.value;
                const category = categorySelect.value;
                addNewPost(content, category);
            });

            contentInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    submitBtn.click();
                }
            });
        }

        init();
    })();
</script>
</body>

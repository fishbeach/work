<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>校園尋物牆 | 匿名尋物留言板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2a4b7c;
            --primary-hover: #1e375a;
            --accent: #ff7b42;
            --bg-start: #f3f6fd;
            --bg-end: #e7ecf5;
            --card-bg: #ffffff;
            --card-border: rgba(0,0,0,0.04);
            --text-dark: #1a2332;
            --text-medium: #3e4a5b;
            --text-light: #6f7a8a;
            --success: #2c9c6a;
            --warning: #f0a04b;
            --danger: #d65b5b;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 40px -12px rgba(0,0,0,0.12);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-full: 50px;
            --transition: 0.2s cubic-bezier(0.2, 0.0, 0, 1.0);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(155deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 2.5rem; }

        .header h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 700;
            background: linear-gradient(135deg, #1a3c6e 0%, #2f5496 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.8px;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
        }

        .header p {
            font-size: 1.05rem;
            color: var(--text-medium);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            transition: box-shadow var(--transition);
            border: 1px solid rgba(0,0,0,0.03);
            backdrop-filter: blur(2px);
        }

        .form-card:hover { box-shadow: var(--shadow-lg); }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: flex-end;
        }

        .input-group { flex: 3; min-width: 200px; }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.4px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-full);
            border: 1.5px solid #e0e4ec;
            background: #fafbfc;
            font-size: 0.95rem;
            transition: all var(--transition);
            outline: none;
            color: var(--text-dark);
            font-weight: 500;
        }

        .input-group input::placeholder { color: #aab3c2; font-weight: 400; }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(42,75,124,0.12);
            background: white;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(42,75,124,0.25);
            white-space: nowrap;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(42,75,124,0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(42,75,124,0.2);
        }

        .search-box { flex: 2; min-width: 180px; }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.4rem;
            border-radius: var(--radius-full);
            border: 1.5px solid #e0e4ec;
            background: white;
            font-size: 0.95rem;
            outline: none;
            transition: all var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(42,75,124,0.12);
        }

        .filters-panel {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-full);
            padding: 0.9rem 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255,255,255,0.7);
            transition: box-shadow var(--transition);
        }

        .filters-panel:hover { box-shadow: var(--shadow-md); }

        .filter-group { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }

        .filter-label {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .filter-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .filter-btn {
            background: #f1f4f9;
            border: none;
            padding: 0.45rem 1.1rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-medium);
            letter-spacing: 0.2px;
        }

        .filter-btn:hover { background: #e2e7f2; color: var(--primary); }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(42,75,124,0.25);
        }

        .stats-container {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .stats-container h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary); }
        canvas#statsChart { max-width: 100%; height: auto; }

        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.8rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 1.5rem 1.6rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(42,75,124,0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 40px -16px rgba(0,0,0,0.15);
            border-color: rgba(42,75,124,0.15);
        }

        .card.done-card {
            background: #f8fafc;
            opacity: 0.9;
            border-left: 7px solid var(--success);
            box-shadow: var(--shadow-sm);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
            gap: 0.5rem;
        }

        .category-badge {
            background: #eef2f9;
            padding: 0.25rem 0.9rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.3px;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.9rem;
            border-radius: var(--radius-full);
            background: #e2f3ea;
            color: #1a6b4a;
            font-weight: 600;
        }

        .status-badge.done { background: #eef1f5; color: #5f6b7a; }

        .location-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.8rem;
            color: #5b6e8c;
            background: #f0f4fa;
            padding: 0.2rem 0.8rem;
            border-radius: var(--radius-full);
            margin-bottom: 0.5rem;
            width: fit-content;
            font-weight: 500;
        }

        .content-text {
            font-size: 1rem;
            line-height: 1.45;
            margin: 0.6rem 0;
            color: var(--text-dark);
            font-weight: 500;
            word-break: break-word;
        }

        .meta-info {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            border-top: 1px dashed #e1e6ef;
            padding-top: 0.7rem;
        }

        .card-actions { display: flex; gap: 0.8rem; margin-top: 0.3rem; flex-wrap: wrap; }

        .btn-like {
            background: #fff3ef;
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            color: #d1452c;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.8rem;
        }

        .btn-like:hover {
            background: #ffe2da;
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(209,69,44,0.12);
        }

        .btn-toggle {
            background: #eef2fa;
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--primary);
        }

        .btn-toggle:hover {
            background: #dde5f5;
            box-shadow: 0 2px 8px rgba(42,75,124,0.08);
        }

        .empty-state {
            text-align: center;
            padding: 3.5rem 2rem;
            background: rgba(255,255,255,0.5);
            border-radius: var(--radius-xl);
            color: var(--text-light);
            font-size: 1rem;
            backdrop-filter: blur(4px);
            border: 1px dashed #cbd3e0;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #8b96a5;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @media (max-width: 768px) {
            body { padding: 1.2rem 0.8rem; }
            .form-card { padding: 1.2rem 1.3rem; }
            .form-row { flex-direction: column; align-items: stretch; }
            .input-group, .search-box { flex: auto; min-width: 0; }
            .filters-panel {
                border-radius: var(--radius-xl);
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1.2rem;
            }
            .filter-group { justify-content: space-between; }
            .records-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .btn-primary { justify-content: center; width: 100%; }
            .stats-container { padding: 1rem; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.8rem; }
            .filter-buttons { justify-content: center; }
            .card { padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📌 校園尋物牆</h1>
        <p>匿名協尋｜讓遺失物快點回家</p>
    </div>

    <div class="form-card">
        <div class="form-row">
            <div class="input-group" style="flex:4">
                <label>📝 找什麼東西？ (必填)</label>
                <input type="text" id="contentInput" placeholder="例如：灰色筆電包、學生證..." autocomplete="off">
            </div>
            <div class="input-group" style="flex:2">
                <label>📍 遺失地點 (選填)</label>
                <input type="text" id="locationInput" placeholder="如：三樓餐廳、圖書館前" autocomplete="off">
            </div>
            <div class="input-group" style="flex:1.5">
                <label>📂 分類</label>
                <select id="categorySelect">
                    <option value="書本">📖 書本</option>
                    <option value="文具">✒️ 文具</option>
                    <option value="生活用品">🧴 生活用品</option>
                    <option value="電子用品">💻 電子用品</option>
                    <option value="貴重物品">💎 貴重物品</option>
                    <option value="其他">📦 其他</option>
                </select>
            </div>
            <div class="input-group" style="flex:0 0 auto">
                <button class="btn-primary" id="submitBtn">✚ 發佈尋物帖</button>
            </div>
        </div>
        <div style="font-size:0.7rem; color:#d65b5b; margin-top: 0.6rem; display: none;" id="errorMsg">請填寫尋物內容</div>
    </div>

    <div class="filters-panel">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜尋內容關鍵字..." autocomplete="off">
        </div>
        <div class="search-box">
            <input type="text" id="locationSearchInput" placeholder="📍 搜尋地點..." autocomplete="off">
        </div>
        <div class="filter-group">
            <span class="filter-label">🔖 狀態：</span>
            <div class="filter-buttons" id="statusFilterGroup">
                <button data-status="all" class="filter-btn active">全部</button>
                <button data-status="active" class="filter-btn">進行中</button>
                <button data-status="done" class="filter-btn">已完成</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="filter-label">🗂️ 分類：</span>
            <div class="filter-buttons" id="categoryFilterGroup">
                <button data-cat="all" class="filter-btn active">全部</button>
                <button data-cat="書本" class="filter-btn">書本</button>
                <button data-cat="文具" class="filter-btn">文具</button>
                <button data-cat="生活用品" class="filter-btn">生活用品</button>
                <button data-cat="電子用品" class="filter-btn">電子用品</button>
                <button data-cat="貴重物品" class="filter-btn">貴重物品</button>
                <button data-cat="其他" class="filter-btn">其他</button>
            </div>
        </div>
    </div>

    <div id="statsContainer" class="stats-container">
        <h2>📊 尋物統計</h2>
        <canvas id="statsChart" width="600" height="300"></canvas>
    </div>

    <div id="recordsContainer" class="records-grid">
        <div class="empty-state">✨ 正在從雲端載入資料…</div>
    </div>
    <footer>⚡ 匿名發佈 • 按讚幫助曝光 • 完成尋獲後可標記 done</footer>
</div>

<script>
    (function() {
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZkq4jirN-P9BdJFFTId7mNQ3fxtMzqC1GIZkA1nY-fSpD39HaEZYlXmAOVQv_I0zoaQ/exec";
        const STORAGE_KEY = "records";

        const contentInput = document.getElementById("contentInput");
        const locationInput = document.getElementById("locationInput");
        const categorySelect = document.getElementById("categorySelect");
        const submitBtn = document.getElementById("submitBtn");
        const errorMsgDiv = document.getElementById("errorMsg");
        const recordsContainer = document.getElementById("recordsContainer");
        const searchInput = document.getElementById("searchInput");
        const locationSearchInput = document.getElementById("locationSearchInput");
        const statsCanvas = document.getElementById("statsChart");

        let allRecords = [];
        let currentStatusFilter = "all";
        let currentCategoryFilter = "all";
        let currentSearchTerm = "";
        let currentLocationTerm = "";

        function getFieldIgnoreCase(obj, fieldName) {
            if (!obj) return "";
            const lowerField = String(fieldName).toLowerCase();
            for (let key of Object.keys(obj)) {
                if (String(key).toLowerCase() === lowerField) {
                    return obj[key];
                }
            }
            return "";
        }

        function normalizeRecord(sheetRow) {
            return {
                id: getFieldIgnoreCase(sheetRow, "id") || "",
                createdAt: (() => {
                    const raw = getFieldIgnoreCase(sheetRow, "createdAt");
                    if (!raw) return Date.now();
                    const ts = new Date(raw).getTime();
                    return isNaN(ts) ? Date.now() : ts;
                })(),
                status: (String(getFieldIgnoreCase(sheetRow, "status")).toLowerCase() === "done") ? "done" : "active",
                content: getFieldIgnoreCase(sheetRow, "content") || "",
                category: getFieldIgnoreCase(sheetRow, "category") || "其他",
                likes: Number(getFieldIgnoreCase(sheetRow, "likes")) || 0,
                location: String(getFieldIgnoreCase(sheetRow, "location") || "")  // ✅ 強制轉字串
            };
        }

        async function fetchRecordsFromSheet() {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "讀取失敗");
            return data.records.map(normalizeRecord);
        }

        async function syncToSheet(payload) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "同步失敗");
            return data;
        }

        function saveToLocalStorage(records) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch(e) {}
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            try { return JSON.parse(raw); } catch(e) { return []; }
        }

        async function loadDataFromSheet() {
            try {
                const records = await fetchRecordsFromSheet();
                allRecords = records;
                allRecords.sort((a,b) => b.createdAt - a.createdAt);
                saveToLocalStorage(allRecords);
                renderFilteredList();
            } catch (err) {
                console.error("後端載入失敗：", err);
                allRecords = loadFromLocalStorage();
                allRecords.sort((a,b) => b.createdAt - a.createdAt);
                if (allRecords.length === 0) {
                    recordsContainer.innerHTML = '<div class="empty-state">📭 暫無任何記錄（後端與本地皆無資料）</div>';
                } else {
                    renderFilteredList();
                }
            }
        }

        async function addNewPost(content, category, location) {
            if (!content || content.trim() === "") {
                errorMsgDiv.style.display = "block";
                setTimeout(() => { errorMsgDiv.style.display = "none"; }, 2000);
                return;
            }
            errorMsgDiv.style.display = "none";

            const newRecord = {
                id: Date.now() + '-' + Math.random().toString(36).substring(2,8),
                createdAt: Date.now(),
                status: "active",
                content: content.trim(),
                category: category,
                likes: 0,
                location: location ? location.trim() : ""
            };

            allRecords.unshift(newRecord);
            saveToLocalStorage(allRecords);
            renderFilteredList();
            contentInput.value = "";
            locationInput.value = "";

            try {
                await syncToSheet({ action: "create", record: newRecord });
                await loadDataFromSheet();
            } catch(e) {
                console.warn("同步失敗，記錄僅保留在本地", e);
            }
        }

        async function updateRecord(id, changes) {
            const idx = allRecords.findIndex(r => r.id === id);
            if (idx === -1) return;
            const oldRecord = allRecords[idx];
            const updatedRecord = { ...oldRecord, ...changes };
            allRecords[idx] = updatedRecord;
            saveToLocalStorage(allRecords);
            renderFilteredList();

            try {
                await syncToSheet({ action: "update", id, changes });
                await loadDataFromSheet();
            } catch(e) {
                console.warn("更新同步失敗", e);
            }
        }

        function drawStatsChart(records) {
            if (!statsCanvas) return;
            const ctx = statsCanvas.getContext("2d");
            const categories = ["書本", "文具", "生活用品", "電子用品", "貴重物品", "其他"];
            const activeCounts = {};
            const doneCounts = {};

            categories.forEach(cat => { activeCounts[cat] = 0; doneCounts[cat] = 0; });

            records.forEach(rec => {
                const cat = rec.category || "其他";
                if (categories.includes(cat)) {
                    if (rec.status === "active") activeCounts[cat]++;
                    else if (rec.status === "done") doneCounts[cat]++;
                }
            });

            ctx.clearRect(0, 0, statsCanvas.width, statsCanvas.height);
            const barWidth = 40, gap = 30, startX = 80;
            const chartHeight = statsCanvas.height - 60;
            const maxVal = Math.max(1, ...categories.map(c => activeCounts[c] + doneCounts[c]));
            const scale = chartHeight / maxVal;

            ctx.fillStyle = "#6f7a8a";
            ctx.font = "12px Inter, sans-serif";
            ctx.textAlign = "right";
            for (let i = 0; i <= maxVal; i++) {
                const y = statsCanvas.height - 30 - i * scale;
                ctx.fillText(i, startX - 10, y + 4);
                ctx.beginPath();
                ctx.strokeStyle = "#e0e4ec";
                ctx.moveTo(startX - 5, y);
                ctx.lineTo(statsCanvas.width - 20, y);
                ctx.stroke();
            }

            categories.forEach((cat, idx) => {
                const x = startX + idx * (barWidth * 2 + gap);
                const activeH = activeCounts[cat] * scale;
                ctx.fillStyle = "#2a4b7c";
                ctx.fillRect(x, statsCanvas.height - 30 - activeH, barWidth, activeH);
                const doneH = doneCounts[cat] * scale;
                ctx.fillStyle = "#2c9c6a";
                ctx.fillRect(x + barWidth, statsCanvas.height - 30 - doneH, barWidth, doneH);

                ctx.fillStyle = "#1a2332";
                ctx.font = "11px Inter, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(cat, x + barWidth, statsCanvas.height - 10);
            });

            ctx.fillStyle = "#2a4b7c";
            ctx.fillRect(statsCanvas.width - 120, 20, 12, 12);
            ctx.fillStyle = "#1a2332";
            ctx.font = "12px Inter, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("進行中", statsCanvas.width - 105, 31);

            ctx.fillStyle = "#2c9c6a";
            ctx.fillRect(statsCanvas.width - 120, 45, 12, 12);
            ctx.fillText("已完成", statsCanvas.width - 105, 56);
        }

        function renderList(recordsToShow) {
            recordsContainer.innerHTML = "";
            if (!recordsToShow || recordsToShow.length === 0) {
                recordsContainer.innerHTML = '<div class="empty-state">📭 沒有符合條件的尋物帖，試試變更篩選器～</div>';
                return;
            }
            const sorted = [...recordsToShow].sort((a,b) => b.createdAt - a.createdAt);
            for (let record of sorted) {
                const card = document.createElement("div");
                card.className = "card";
                if (record.status === "done") card.classList.add("done-card");

                const dateObj = new Date(record.createdAt);
                const formattedDate = `${dateObj.getFullYear()}/${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours().toString().padStart(2,'0')}:${dateObj.getMinutes().toString().padStart(2,'0')}`;

                const categoryMap = {
                    "書本":"📖 書本","文具":"✒️ 文具","生活用品":"🧴 生活用品",
                    "電子用品":"💻 電子用品","貴重物品":"💎 貴重物品","其他":"📦 其他"
                };
                const categoryShow = categoryMap[record.category] || record.category;
                const statusText = record.status === "active" ? "🔍 尋找中" : "✅ 已完成尋獲";
                const statusClass = record.status === "active" ? "" : "done";
                const locationHTML = record.location ? `<div class="location-tag">📍 ${escapeHtml(record.location)}</div>` : "";

                card.innerHTML = `
                    <div class="card-header">
                        <span class="category-badge">${categoryShow}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    ${locationHTML}
                    <div class="content-text">${escapeHtml(record.content)}</div>
                    <div class="meta-info">
                        <span>🕒 ${formattedDate}</span>
                        <span>❤️ ${record.likes} 人幫推</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn-like" data-id="${record.id}">👍 +1 幫推</button>
                        <button class="btn-toggle" data-id="${record.id}" data-status="${record.status}">${record.status === 'active' ? '🏁 標記完成' : '🔄 恢復 active'}</button>
                    </div>
                `;
                recordsContainer.appendChild(card);
            }

            document.querySelectorAll('.btn-like').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    const record = allRecords.find(r => r.id === id);
                    if (record) {
                        const newLikes = (record.likes || 0) + 1;
                        updateRecord(id, { likes: newLikes });
                    }
                });
            });

            document.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    const currentStatus = btn.getAttribute('data-status');
                    const newStatus = currentStatus === 'active' ? 'done' : 'active';
                    updateRecord(id, { status: newStatus });
                });
            });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        function getFilteredRecords() {
            let filtered = [...allRecords];
            if (currentStatusFilter !== "all") filtered = filtered.filter(rec => rec.status === currentStatusFilter);
            if (currentCategoryFilter !== "all") filtered = filtered.filter(rec => rec.category === currentCategoryFilter);
            if (currentSearchTerm.trim() !== "") {
                const term = currentSearchTerm.trim().toLowerCase();
                filtered = filtered.filter(rec => rec.content.toLowerCase().includes(term));
            }
            if (currentLocationTerm.trim() !== "") {
                const locTerm = currentLocationTerm.trim().toLowerCase();
                filtered = filtered.filter(rec => rec.location && rec.location.toLowerCase().includes(locTerm));
            }
            return filtered;
        }

        function renderFilteredList() {
            const filtered = getFilteredRecords();
            renderList(filtered);
            drawStatsChart(allRecords);
        }

        function initFilters() {
            const statusBtns = document.querySelectorAll("#statusFilterGroup .filter-btn");
            const categoryBtns = document.querySelectorAll("#categoryFilterGroup .filter-btn");

            statusBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const statusVal = btn.getAttribute("data-status");
                    if (statusVal) {
                        currentStatusFilter = statusVal;
                        statusBtns.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        renderFilteredList();
                    }
                });
            });

            categoryBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const catVal = btn.getAttribute("data-cat");
                    if (catVal) {
                        currentCategoryFilter = catVal;
                        categoryBtns.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        renderFilteredList();
                    }
                });
            });

            searchInput.addEventListener("input", () => {
                currentSearchTerm = searchInput.value;
                renderFilteredList();
            });

            locationSearchInput.addEventListener("input", () => {
                currentLocationTerm = locationSearchInput.value;
                renderFilteredList();
            });
        }

        function init() {
            initFilters();
            loadDataFromSheet();

            submitBtn.addEventListener("click", () => {
                const content = contentInput.value;
                const category = categorySelect.value;
                const location = locationInput.value;
                addNewPost(content, category, location);
            });

            contentInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    submitBtn.click();
                }
            });
        }

        init();
    })();
</script>
</body>
</html>
